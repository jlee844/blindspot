[project]
name = "blindspot"
version = "0.1.0"
description = "Which lines in this change would a test actually catch a bug in?"
requires-python = ">=3.9"
dependencies = ["coverage>=7.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blindspot = "blindspot.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
